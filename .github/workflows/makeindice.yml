name: Generate eleyrad index.html

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index.html
        run: |
          mkdir -p eleyrad
          cd eleyrad
          FILES=$(ls eleyrad_*.html 2>/dev/null || echo "")
          
          if [ -z "$FILES" ]; then
            echo "No eleyrad_*.html files found."
            exit 0
          fi
          
          printf '<!DOCTYPE html>\n<html>\n<head>\n<title>Eleyrad Files</title>\n<style>\n' > index.html
          printf 'body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; }\nul { list-style: none; padding: 0; }\nli { margin: 10px 0; }\n' >> index.html
          printf 'a { display: block; padding: 10px; background: #f5f5f5; text-decoration: none; border-radius: 5px; }\na:hover { background: #e0e0e0; }\n</style>\n</head>\n<body>\n<h1>Eleyrad Files Directory</h1>\n<ul>\n' >> index.html
          
          for file in $FILES; do
            printf '  <li><a href="%s">%s</a></li>\n' "$file" "$file" >> index.html
          done
          
          printf '</ul>\n<p>Generated automatically via GitHub Actions.</p>\n</body>\n</html>\n' >> index.html
          
          echo "Generated index.html with $(echo $FILES | wc -w) files: $FILES"

      - name: Commit and push index.html
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [ -f "eleyrad/index.html" ]; then
            git add eleyrad/index.html
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update eleyrad/index.html [skip ci]"
              git push
            fi
          else
            echo "eleyrad/index.html not found - skipping commit"
          fi
